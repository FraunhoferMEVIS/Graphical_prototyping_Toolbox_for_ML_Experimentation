<div class="title-container">
  <mat-icon
    class="my-3.5 ml-2 top-0 icon-white"
    aria-hidden="false"
    aria-label="Example home icon"
    fontIcon="{{ getIcon(data.moduleInstance.blueprint.category) }}"
  ></mat-icon>
  <div class="title mat-h2" data-testid="title">{{ data.label }}</div>
  <button
    (pointerdown)="$event.stopPropagation()"
    class="icon-cfg icon-white"
    mat-icon-button
    aria-label="Node config"
    (click)="openConfig()"
  >
    <mat-icon>settings</mat-icon>
  </button>
</div>
<!-- <div class="label">
  {{ data.moduleInstance.module.label }}
</div> -->
<div
  class="output"
  *ngFor="let output of data.outputs | keyvalue: sortByIndex"
  [attr.data-testid]="'output-' + output.key"
>
  <!-- <div class="output-title" data-testid="output-title">
    {{ output.value?.label }}
  </div> -->
  <div
    class="output-socket"
    refComponent
    [data]="{
      type: 'socket',
      side: 'output',
      key: output.key,
      nodeId: data.id,
      payload: output.value?.socket,
      seed: seed
    }"
    [emit]="emit"
    data-testid="output-socket"
  ></div>
</div>
<div
  class="control"
  *ngFor="let control of data.controls | keyvalue: sortByIndex"
  refComponent
  [data]="{ type: 'control', payload: control.value }"
  [emit]="emit"
  [attr.data-testid]="'control-' + control.key"
></div>
<div class="flex flex-row center justify-items-center">
  <button
    *ngIf="!isRunning"
    (pointerdown)="$event.stopPropagation()"
    class="icon-button"
    mat-button
    (click)="runModule()"
  >
    <mat-icon>play_arrow</mat-icon>
    Run
  </button>
  <button
    *ngIf="isRunning"
    (pointerdown)="$event.stopPropagation()"
    class="icon-button"
    mat-button
    (click)="stopModule()"
  >
    <mat-icon>stop</mat-icon>
    Stop
  </button>
  <button
    (pointerdown)="$event.stopPropagation()"
    class="icon-button"
    mat-button
    [disabled]="isRunning"
    (click)="openPreview()"
  >
    <mat-icon>preview</mat-icon>
    View
  </button>
</div>
<div
  class="input"
  *ngFor="let input of data.inputs | keyvalue: sortByIndex"
  [attr.data-testid]="'input-' + input.key"
>
  <div
    class="input-socket"
    refComponent
    [data]="{
      type: 'socket',
      side: 'input',
      key: input.key,
      nodeId: data.id,
      payload: input.value?.socket,
      seed: seed
    }"
    [emit]="emit"
    data-testid="input-socket"
  ></div>
  <!-- <div
    class="input-title"
    data-testid="input-title"
    *ngIf="!input.value?.control || !input.value?.showControl"
  >
    {{ input.value?.label }}
  </div> -->
  <div
    class="input-control"
    [style.display]="
      input.value?.control && input.value?.showControl ? '' : 'none'
    "
    refComponent
    [data]="{ type: 'control', payload: input.value?.control }"
    [emit]="emit"
    data-testid="input-control"
  ></div>
</div>
