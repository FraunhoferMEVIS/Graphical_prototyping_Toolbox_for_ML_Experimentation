<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <div [innerHTML]="data.description"></div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button
    mat-raised-button
    color="primary"
    [mat-dialog-close]="true"
    cdkFocusInitial
  >
    Close
  </button>
</mat-dialog-actions>
