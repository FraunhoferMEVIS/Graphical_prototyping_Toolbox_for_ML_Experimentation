<div title="{{ data.moduleInstance.module.description }}">
  <div class="module-info">
    <h1 class="module-node-title basis-10/12" data-testid="title">
      {{ data.moduleInstance.module.title }}
    </h1>
    <div class="module-node-subtitle" data-testid="title">
      {{ data.moduleInstance.module.subtitle }}
    </div>
    <div class="module-node-icon sm:shrink-0" *ngIf="data.moduleInstance.module.icon.length > 0">
      <img class="module-node-img" src="{{ data.moduleInstance.module.icon }}" />
    </div>
  </div>
  <div class="flex flex-row">
    <div class="input basis-1/2 flex flex-row" *ngFor="let input of data.inputs | keyvalue : sortByIndex"
      [attr.data-testid]="'input-' + input.key">
      <div class="input-socket" refComponent [data]="{
          type: 'socket',
          side: 'input',
          key: input.key,
          nodeId: data.id,
          payload: input.value?.socket,
          seed: seed
        }" [emit]="emit" data-testid="input-socket"></div>
      <!-- <div
        class="input-title"
        data-testid="input-title"
        *ngIf="!input.value?.control || !input.value?.showControl"
      >
        {{ input.value?.label }}
      </div> -->
      <!-- <div
        class="module-data-in"
        *ngIf="data.moduleInstance.data.in.length > 0"
      >
        <workflow-module-io
          (pointerdown)="$event.stopPropagation()"
          (dblclick)="$event.stopPropagation()"
          [ioList]="data.moduleInstance.data.in"
        />
      </div> -->
      <!-- <div
        class="input-control"
        [style.display]="
          input.value?.control && input.value?.showControl ? '' : 'none'
        "
        refComponent
        [data]="{ type: 'control', payload: input.value?.control }"
        [emit]="emit"
        data-testid="input-control"
      ></div> -->
    </div>
    <div class="output basis-1/2" *ngFor="let output of data.outputs | keyvalue : sortByIndex"
      [attr.data-testid]="'output-' + output.key">
      <div class="output-title" data-testid="output-title" *ngIf="data.moduleInstance.data.out.length > 0">
        <!-- {{
          data.moduleInstance.data.out[data.moduleInstance.data.out.length - 1]
            .meta.label
        }} -->
      </div>
      <div class="output-socket" refComponent [data]="{
          type: 'socket',
          side: 'output',
          key: output.key,
          nodeId: data.id,
          payload: output.value?.socket,
          seed: seed
        }" [emit]="emit" data-testid="output-socket"></div>
    </div>
  </div>
  <div class="control grow" *ngFor="let control of data.controls | keyvalue : sortByIndex" refComponent
    [data]="{ type: 'control', payload: control.value }" [emit]="emit" [attr.data-testid]="'control-' + control.key">
  </div>
  <!-- <module-state
    [state]="data.moduleInstance.state"
    class="justify-self-start my-0"
  ></module-state> -->
</div>
