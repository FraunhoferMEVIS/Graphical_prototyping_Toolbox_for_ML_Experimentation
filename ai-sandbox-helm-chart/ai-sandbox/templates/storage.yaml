apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.global.storage.name }}
  {{ if .Values.global.namespace }}
  namespace: {{ .Values.global.namespace }}
  {{ end }}
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ .Values.global.storage.size }}